# Modal runtime preset for PaperBench.
#
# Runs agent, reproduction, and grading stages on Modal Sandboxes
# instead of local Docker containers (Alcatraz/LocalConfig).
#
# Usage:
#   python tools/pb_run.py --env-config configs/modal_env.yaml \
#       paperbench.paper_split=pilot \
#       paperbench.solver.time_limit=3600

version: 1

defaults:
  # Modal-specific defaults (these are fields on ModalComputerRuntime, not ClusterConfig).
  sandbox_timeout: 14400     # 4 hours max sandbox lifetime (was 86400)
  enable_docker_daemon: false
  # Environment variables injected into every sandbox.
  environment:
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    OPENAI_BASE_URL: ${LLM_BASE_URL:-}

# Component-level configs.
# Image is built programmatically by ModalComputerRuntime._build_image().
components:
  solver:
    # Runtime class — full chz import path.
    type: "paperbench.runtime.modal:ModalComputerRuntime"
    gpu_type: "a10g"
    gpu_count: 1

  judge:
    type: "paperbench.runtime.modal:ModalComputerRuntime"
    # Judge is CPU-only (just LLM API calls).
    gpu_type: null
    gpu_count: 0

  reproduction:
    type: "paperbench.runtime.modal:ModalComputerRuntime"
    # Reproduction typically needs GPU (runs reproduce.sh with model inference).
    gpu_type: "a10g"
    gpu_count: 1
